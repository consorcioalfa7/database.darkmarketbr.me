<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#0a0a0a"/>
  
  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.3"/>
  
  <!-- Database icon -->
  <g transform="translate(128, 100)" filter="url(#glow)">
    <!-- Main cylinder -->
    <ellipse cx="128" cy="50" rx="100" ry="40" fill="url(#grad1)"/>
    <rect x="28" y="50" width="200" height="200" fill="url(#grad1)"/>
    <ellipse cx="128" cy="250" rx="100" ry="40" fill="url(#grad2)"/>
    
    <!-- Inner lines -->
    <ellipse cx="128" cy="100" rx="100" ry="40" fill="none" stroke="#0a0a0a" stroke-width="3" opacity="0.5"/>
    <ellipse cx="128" cy="150" rx="100" ry="40" fill="none" stroke="#0a0a0a" stroke-width="3" opacity="0.5"/>
    <ellipse cx="128" cy="200" rx="100" ry="40" fill="none" stroke="#0a0a0a" stroke-width="3" opacity="0.5"/>
    
    <!-- Highlight -->
    <ellipse cx="128" cy="50" rx="100" ry="40" fill="url(#grad2)" opacity="0.3"/>
  </g>
  
  <!-- DT Letters -->
  <g transform="translate(180, 400)">
    <text x="0" y="0" font-family="Arial Black, sans-serif" font-size="48" font-weight="900" fill="url(#grad1)">DT</text>
  </g>
</svg>
